<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PraxisTrack - Autenticación</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- SDK oficial de Supabase para manejo de Auth en el navegador -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .auth-container {
            max-width: 400px;
            margin: 2rem auto;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 2rem;
        }
        .topnav {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 0.75rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .topnav-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 700;
        }
        .topnav-brand span {
            background-color: var(--accent-amber);
            color: #000;
            font-size: 0.7rem;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
        }
        .topnav-menu, .topnav-actions {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        .topnav-menu a, .topnav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }
        .topnav-menu a:hover, .topnav-link:hover {
            color: var(--accent-amber);
        }
        .topnav-auth-action {
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
        }
        .auth-tabs {
            display: flex;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }
        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 0.75rem;
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s, border-bottom 0.2s;
        }
        .auth-tab.active {
            color: var(--accent-amber);
            border-bottom: 2px solid var(--accent-amber);
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--accent-amber);
        }
        .auth-btn {
            width: 100%;
            margin-top: 1rem;
            padding: 0.75rem;
        }
        .alert {
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            display: none;
        }
        .alert-error {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
        }
        .alert-success {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            border: 1px solid var(--success-color);
        }
        @media (max-width: 720px) {
            .topnav {
                padding: 0.75rem 1rem;
                flex-wrap: wrap;
                gap: 0.75rem;
            }
            .topnav-menu {
                order: 3;
                width: 100%;
                justify-content: space-between;
                gap: 0.75rem;
            }
            .topnav-actions {
                gap: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <header class="topnav">
        <a href="marketplace.html" class="topnav-brand">
            PraxisTrack <span>v2.4</span>
        </a>
        <nav class="topnav-menu" aria-label="Navegación principal">
            <a href="marketplace.html">Marketplace</a>
            <a href="bitacora.html">Mi Bitácora</a>
            <a href="postulaciones.html">Postulaciones</a>
        </nav>
        <div class="topnav-actions">
            <a href="perfil.html" class="topnav-link">Mi Perfil</a>
            <a href="#form-login" id="auth-btn-action" class="btn-primary topnav-auth-action">Iniciar sesión</a>
        </div>
    </header>

    <div class="container">
        <div class="auth-container">
            <h2 style="text-align: center; margin-bottom: 1.5rem;">PraxisTrack</h2>

            <div class="auth-tabs">
                <button id="tab-login" class="auth-tab active" onclick="switchTab('login')">Iniciar Sesión</button>
                <button id="tab-register" class="auth-tab" onclick="switchTab('register')">Registrarse</button>
            </div>

            <div id="alert-box" class="alert"></div>

            <!-- Formulario de Inicio de Sesión -->
            <form id="form-login" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-email">Correo Electrónico</label>
                    <input type="email" id="login-email" required placeholder="correo@ejemplo.com">
                </div>
                <div class="form-group">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary auth-btn">Ingresar</button>
            </form>

            <!-- Formulario de Registro (Rol Estudiante por defecto según trigger de BD) -->
            <form id="form-register" style="display: none;" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="reg-nombre">Nombre Completo</label>
                    <input type="text" id="reg-nombre" required placeholder="Tu Nombre">
                </div>
                <div class="form-group">
                    <label for="reg-cedula">Cédula / Documento de Identidad</label>
                    <input type="text" id="reg-cedula" required placeholder="V-12345678">
                </div>
                <div class="form-group">
                    <label for="reg-email">Correo Electrónico</label>
                    <input type="email" id="reg-email" required placeholder="correo@ejemplo.com">
                </div>
                <div class="form-group">
                    <label for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" required placeholder="Mínimo 6 caracteres">
                </div>
                <button type="submit" class="btn-primary auth-btn">Crear Cuenta de Estudiante</button>
            </form>
        </div>
    </div>

    <footer>
        <p>Centro de condiciones y privacidad de PraxisTrack</p>
    </footer>

    <!-- Scripts de inicialización -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
        // Inicializar cliente de Supabase en el navegador
        const supabaseClient = window.PRAXISTRACK_CONFIG.supabaseClient;

        function switchTab(tab) {
            const loginForm = document.getElementById('form-login');
            const registerForm = document.getElementById('form-register');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            hideAlert();

            if (tab === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
            }
        }

        function showAlert(message, type = 'error') {
            const box = document.getElementById('alert-box');
            box.textContent = message;
            box.className = `alert alert-${type}`;
            box.style.display = 'block';
        }

        function hideAlert() {
            const box = document.getElementById('alert-box');
            box.style.display = 'none';
        }

        async function initializeAuthNav() {
            const authAction = document.getElementById('auth-btn-action');
            const { data, error } = await supabaseClient.auth.getSession();

            if (error) {
                showAlert(`No se pudo comprobar la sesión: ${error.message}`);
                return;
            }

            if (data.session) {
                authAction.textContent = 'Cerrar sesión';
                authAction.href = '#';
                authAction.onclick = async event => {
                    event.preventDefault();
                    const { error: signOutError } = await supabaseClient.auth.signOut();
                    if (signOutError) {
                        showAlert(`No se pudo cerrar la sesión: ${signOutError.message}`);
                        return;
                    }
                    window.location.reload();
                };
                return;
            }

            authAction.onclick = event => {
                event.preventDefault();
                switchTab('login');
                document.getElementById('form-login').scrollIntoView({ behavior: 'smooth' });
            };
        }

        async function handleLogin(e) {
            e.preventDefault();
            hideAlert();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                showAlert(error.message);
                return;
            }

            showAlert('¡Inicio de sesión exitoso! Redirigiendo...', 'success');
            setTimeout(() => {
                window.location.href = 'marketplace.html';
            }, 1000);
        }

        async function handleRegister(e) {
            e.preventDefault();
            hideAlert();
            const nombre = document.getElementById('reg-nombre').value;
            const cedula = document.getElementById('reg-cedula').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            // Al registrarse, pasamos metadata que el trigger de Supabase usará para crear el perfil automáticamente
            const { data, error } = await supabaseClient.auth.signUp({
                email,
                password,
                options: {
                    data: {
                        nombre_completo: nombre,
                        documento_identidad: cedula
                    }
                }
            });

            if (error) {
                showAlert(error.message);
                return;
            }

            showAlert('¡Cuenta creada con éxito! Revisa tu correo o inicia sesión.', 'success');
            setTimeout(() => {
                switchTab('login');
            }, 2000);
        }

        initializeAuthNav();
    </script>
</body>
</html>
